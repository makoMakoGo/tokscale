name: Session Navigation Validation

on:
  pull_request:
    branches:
      - personal/local-clients

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'codex/issue-153-session-navigation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/issue-153-session-navigation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply prepared implementation once
        id: apply
        continue-on-error: true
        run: |
          set -o pipefail
          if ! grep -q 'pub struct SessionUsage' crates/tokscale-core/src/usage_views.rs; then
            awk '
              /^      - name: Apply session navigation implementation$/ { found = 1; next }
              found && /^        run: \|$/ { in_run = 1; next }
              in_run && /^      - name: / { exit }
              in_run { sub(/^          /, ""); print }
            ' .github/workflows/prepare-session-navigation.yml > /tmp/apply-session-navigation.sh
            python3 - <<'PY'
          from pathlib import Path

          path = Path('/tmp/apply-session-navigation.sh')
          script = path.read_text()
          script = script.replace(
              'from pathlib import Path\n',
              'from pathlib import Path\nimport re\n',
              1,
          )
          original = '''def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"missing replacement in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))
          '''
          replacement = '''def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old in text:
                  file.write_text(text.replace(old, new, 1))
                  return

              pieces = re.split(r"(\\s+)", old)
              pattern = "".join(
                  r"\\s+" if piece.isspace() else re.escape(piece)
                  for piece in pieces
                  if piece
              )
              matches = list(re.finditer(pattern, text, flags=re.MULTILINE))
              if len(matches) != 1:
                  raise SystemExit(
                      f"missing or ambiguous replacement in {path}: "
                      f"{old[:120]!r}; matches={len(matches)}"
                  )
              match = matches[0]
              file.write_text(text[:match.start()] + new + text[match.end():])
          '''
          if original not in script:
              raise SystemExit('cannot replace generated replace_once helper')
          script = script.replace(original, replacement, 1)
          path.write_text(script)
          PY
            test -s /tmp/apply-session-navigation.sh
            bash /tmp/apply-session-navigation.sh 2>&1 | tee apply-session-navigation.log
            python3 - <<'PY'
          from pathlib import Path
          import re

          # Close the generated Footer match arm.
          path = Path('crates/tokscale-cli/src/tui/ui/footer.rs')
          text = path.read_text()
          pattern = re.compile(
              r'(Tab::Issues\s*=>\s*format!\(\s*" \(\{\} sources · \{\} sessions\)",\s*'
              r'app\.get_sorted_session_sources\(\)\.len\(\),\s*'
              r'app\.data\.sessions\.len\(\)\s*\))'
              r'(\s*\n\s*Tab::Stats)',
              flags=re.DOTALL,
          )
          text, replacements = pattern.subn(r'\1,\2', text, count=1)
          if replacements != 1:
              raise SystemExit('could not repair generated footer match arm')
          path.write_text(text)

          # The weekday aggregate moved out of Hourly Profile.
          path = Path('crates/tokscale-cli/src/tui/data/mod.rs')
          text = path.read_text()
          old = 'aggregate_by_period, aggregate_by_weekday, build_period_usage, find_peak_hour,'
          if old not in text:
              raise SystemExit('could not remove obsolete weekday re-export')
          path.write_text(text.replace(
              old,
              'aggregate_by_period, build_period_usage, find_peak_hour,',
              1,
          ))

          # This test is self-contained after the profile simplification.
          path = Path('crates/tokscale-cli/src/tui/ui/hourly_profile.rs')
          text = path.read_text()
          old = '#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]'
          if old not in text:
              raise SystemExit('could not remove obsolete hourly test import')
          path.write_text(text.replace(
              old,
              '#[cfg(test)]\nmod tests {\n    #[test]',
              1,
          ))

          # Sessions is now a selectable list, not the old text viewport.
          path = Path('crates/tokscale-cli/src/tui/app.rs')
          text = path.read_text()
          obsolete_test = re.compile(
              r'\n    #\[test\]\n'
              r'    fn issues_tab_key_scrolls_text_viewport_without_table_selection\(\) \{.*?'
              r'\n    \}\n',
              flags=re.DOTALL,
          )
          text, replacements = obsolete_test.subn('\n', text, count=1)
          if replacements != 1:
              raise SystemExit('could not remove obsolete Issues viewport test')
          signature = 'pub fn get_sorted_sessions(&self) -> Vec<&SessionUsage> {'
          if signature not in text:
              raise SystemExit('could not update owned session rows')
          text = text.replace(
              signature,
              'pub fn get_sorted_sessions(&self) -> Vec<SessionUsage> {',
              1,
          )
          collect_pattern = re.compile(
              r'(\.filter\(\|session\| session\.source == source\)\s*)'
              r'(\.collect::<Vec<_>>\(\);)'
          )
          text, replacements = collect_pattern.subn(
              r'\1.cloned()\n            \2',
              text,
              count=1,
          )
          if replacements != 1:
              raise SystemExit('could not clone sorted session rows')
          path.write_text(text)

          # A cache-overflow test constructs the DTO directly.
          path = Path('crates/tokscale-cli/src/tui/cache.rs')
          text = path.read_text()
          function_at = text.index(
              'fn test_load_cache_misses_when_agent_token_normalization_overflows()'
          )
          daily_at = text.index('daily: Vec::new(),', function_at)
          line_at = text.rfind('\n', 0, daily_at) + 1
          indent = text[line_at:daily_at]
          text = text[:line_at] + indent + 'sessions: Vec::new(),\n' + text[line_at:]
          path.write_text(text)

          # Keep the dynamic title alive for the whole Block lifetime.
          path = Path('crates/tokscale-cli/src/tui/ui/issues.rs')
          text = path.read_text()
          old = 'let block = panel_block(app, &format!("{source} Sessions")).title_top('
          if old not in text:
              raise SystemExit('could not bind the Sessions detail title')
          path.write_text(text.replace(
              old,
              'let title = format!("{source} Sessions");\n    let block = panel_block(app, &title).title_top(',
              1,
          ))
          PY
          fi
          rm -f .github/workflows/prepare-session-navigation.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-navigation-apply-log
          path: apply-session-navigation.log
          if-no-files-found: warn
      - name: Stop after patch failure
        if: steps.apply.outcome == 'failure'
        run: exit 1
      - name: Format
        id: format
        continue-on-error: true
        run: |
          set -o pipefail
          cargo fmt --all 2>&1 | tee session-navigation-format.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-navigation-format-log
          path: session-navigation-format.log
          if-no-files-found: warn
      - name: Stop after format failure
        if: steps.format.outcome == 'failure'
        run: exit 1
      - name: Clippy
        id: clippy
        continue-on-error: true
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee session-navigation-clippy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-navigation-clippy-log
          path: session-navigation-clippy.log
          if-no-files-found: warn
      - name: Stop after Clippy failure
        if: steps.clippy.outcome == 'failure'
        run: exit 1
      - name: Test
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test --workspace --all-features 2>&1 | tee session-navigation-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-navigation-test-log
          path: session-navigation-test.log
          if-no-files-found: warn
      - name: Stop after test failure
        if: steps.test.outcome == 'failure'
        run: exit 1
      - name: Commit validated implementation
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(tui): add source-first session navigation"
          git push origin HEAD:codex/issue-153-session-navigation
