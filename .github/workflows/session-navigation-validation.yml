name: Session Navigation Validation

on:
  push:
    branches:
      - codex/issue-153-session-navigation
  pull_request:
    branches:
      - personal/local-clients

permissions:
  contents: write

concurrency:
  group: session-navigation-validation
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' ||
       github.head_ref == 'codex/issue-153-session-navigation')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/issue-153-session-navigation
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check source-first Sessions patch
        id: patch
        run: |
          set +e
          git apply --check .github/session-navigation-v2.patch > session-patch-diagnostics.log 2>&1
          status=$?
          cat session-patch-diagnostics.log
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload patch diagnostics
        if: steps.patch.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: session-patch-diagnostics
          path: session-patch-diagnostics.log
          if-no-files-found: error

      - name: Stop after patch failure
        if: steps.patch.outputs.status != '0'
        run: exit 1

      - name: Apply source-first Sessions implementation
        if: steps.patch.outputs.status == '0'
        run: |
          git apply .github/session-navigation-v2.patch
          git rm -f \
            .github/session-navigation-v2.patch \
            .github/workflows/session-navigation-validation.yml

      - name: Format
        if: steps.patch.outputs.status == '0'
        run: cargo fmt --all

      - name: Clippy
        if: steps.patch.outputs.status == '0'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        if: steps.patch.outputs.status == '0'
        run: cargo test --workspace --all-features

      - name: Commit validated implementation
        if: steps.patch.outputs.status == '0'
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "fix(tui): add source-first session navigation"
          git push origin HEAD:codex/issue-153-session-navigation
