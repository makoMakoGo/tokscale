name: Session Navigation Validation

on:
  push:
    branches:
      - codex/issue-153-session-navigation
  pull_request:
    branches:
      - personal/local-clients

permissions:
  contents: write

concurrency:
  group: session-navigation-validation
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' ||
       github.head_ref == 'codex/issue-153-session-navigation')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/issue-153-session-navigation
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply source-first Sessions implementation
        run: |
          git apply --check .github/session-navigation-v2.patch
          git apply .github/session-navigation-v2.patch
          git rm -f \
            .github/session-navigation-v2.patch \
            .github/workflows/session-navigation-validation.yml

      - name: Format
        run: cargo fmt --all

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Commit validated implementation
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "fix(tui): add source-first session navigation"
          git push origin HEAD:codex/issue-153-session-navigation
