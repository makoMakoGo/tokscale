name: Session Navigation Validation

on:
  pull_request:
    branches:
      - personal/local-clients

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'codex/issue-153-session-navigation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/issue-153-session-navigation
      - name: Collect integration points
        run: |
          mkdir -p diagnostics/files
          rg -n "UsageData \\{" crates > diagnostics/usage-data-constructors.txt || true
          rg -n "CachedUsageData \\{" crates > diagnostics/cached-usage-data-constructors.txt || true
          rg -n "UsageData" crates/tokscale-cli/src/tui crates/tokscale-core/src > diagnostics/usage-data-references.txt || true
          rg -n "issues_viewport|selected_session|Tab::Issues|session_count" crates/tokscale-cli/src/tui > diagnostics/session-ui-references.txt || true
          cp crates/tokscale-core/src/usage_views.rs diagnostics/files/usage_views.rs
          cp crates/tokscale-core/src/aggregate/tui.rs diagnostics/files/core_tui.rs
          cp crates/tokscale-cli/src/tui/data/mod.rs diagnostics/files/data.rs
          cp crates/tokscale-cli/src/tui/cache.rs diagnostics/files/cache.rs
          cp crates/tokscale-cli/src/tui/app.rs diagnostics/files/app.rs
          cp crates/tokscale-cli/src/tui/ui/issues.rs diagnostics/files/issues.rs
          cp crates/tokscale-cli/src/tui/ui/footer.rs diagnostics/files/footer.rs
          cp crates/tokscale-cli/src/tui/ui/header.rs diagnostics/files/header.rs
      - uses: actions/upload-artifact@v4
        with:
          name: session-navigation-diagnostics
          path: diagnostics
          if-no-files-found: error
