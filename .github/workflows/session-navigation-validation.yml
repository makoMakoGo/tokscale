name: Session Navigation Validation

on:
  pull_request:
    branches:
      - personal/local-clients

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'codex/issue-153-session-navigation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/issue-153-session-navigation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply prepared implementation once
        id: apply
        continue-on-error: true
        run: |
          set -o pipefail
          if ! grep -q 'pub struct SessionUsage' crates/tokscale-core/src/usage_views.rs; then
            awk '
              /^      - name: Apply session navigation implementation$/ { found = 1; next }
              found && /^        run: \|$/ { in_run = 1; next }
              in_run && /^      - name: / { exit }
              in_run { sub(/^          /, ""); print }
            ' .github/workflows/prepare-session-navigation.yml > /tmp/apply-session-navigation.sh
            python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply-session-navigation.sh')
          script = path.read_text()
          for token in ('agent_map,', 'session_map,', 'daily_map,'):
              script = script.replace(f'\n        {token}', f'\n            {token}')
          script = script.replace(
              "\n        daily_map: HashMap::new(),'''",
              "\n            daily_map: HashMap::new(),'''",
          )
          path.write_text(script)
          PY
            test -s /tmp/apply-session-navigation.sh
            bash /tmp/apply-session-navigation.sh 2>&1 | tee apply-session-navigation.log
          fi
          rm -f .github/workflows/prepare-session-navigation.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-navigation-apply-log
          path: apply-session-navigation.log
          if-no-files-found: warn
      - name: Stop after patch failure
        if: steps.apply.outcome == 'failure'
        run: exit 1
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Commit validated implementation
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(tui): add source-first session navigation"
          git push origin HEAD:codex/issue-153-session-navigation
