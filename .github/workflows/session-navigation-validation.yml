name: Session Navigation Validation

on:
  push:
    branches:
      - codex/issue-153-session-navigation

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/issue-153-session-navigation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply source-first Sessions implementation
        run: |
          cat > /tmp/session-navigation.patch.b64 <<'PATCH'
<_>>
PATCH
          base64 -d /tmp/session-navigation.patch.b64 > /tmp/session-navigation.patch
          git apply /tmp/session-navigation.patch
          python3 <<'PY'
          from pathlib import Path

          replacements = [
              (
                  Path('crates/tokscale-cli/src/tui/ui/hourly_profile.rs'),
                  '#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]',
                  '#[cfg(test)]\nmod tests {\n    #[test]',
              ),
              (
                  Path('crates/tokscale-cli/src/tui/ui/daily_profile.rs'),
                  '''\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn profile_and_table_have_a_deliberate_minimum_height() {\n        assert!(MIN_COMBINED_HEIGHT > PANEL_HEIGHT);\n    }\n}\n''',
                  '\n',
              ),
              (
                  Path('crates/tokscale-cli/src/tui/themes.rs'),
                  '''\n    pub(crate) fn secondary_text_style(&self) -> Style {\n        Style::default().fg(self.color(Color::Rgb(170, 170, 170)))\n    }\n''',
                  '\n',
              ),
          ]
          for path, old, new in replacements:
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}")
              path.write_text(text.replace(old, new, 1))
          PY
          rm -f             .github/workflows/prepare-session-navigation.yml             .github/workflows/session-navigation-diagnostics.yml             .github/workflows/session-navigation-validation.yml
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Commit validated implementation
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "fix(tui): add source-first session navigation"
          git push origin HEAD:codex/issue-153-session-navigation
