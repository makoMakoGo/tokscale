name: Session Navigation Validation

on:
  push:
    branches:
      - codex/issue-153-session-navigation
  pull_request:
    branches:
      - personal/local-clients

permissions:
  contents: write

concurrency:
  group: session-navigation-validation
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' ||
       github.head_ref == 'codex/issue-153-session-navigation')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/issue-153-session-navigation
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Normalize and apply source-first Sessions patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          source = Path('.github/session-navigation-v2.patch').read_text().splitlines(keepends=True)
          output: list[str] = []
          index = 0
          header = re.compile(r'^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@(.*?)(\r?\n)?$')

          while index < len(source):
              match = header.match(source[index])
              if match is None:
                  output.append(source[index])
                  index += 1
                  continue

              end = index + 1
              while end < len(source):
                  line = source[end]
                  if line.startswith('@@ ') or line.startswith('--- '):
                      break
                  end += 1

              body = source[index + 1:end]
              old_count = sum(
                  1 for line in body if line.startswith(' ') or line.startswith('-')
              )
              new_count = sum(
                  1 for line in body if line.startswith(' ') or line.startswith('+')
              )
              newline = match.group(4) or '\n'
              output.append(
                  f'@@ -{match.group(1)},{old_count} +{match.group(2)},{new_count} @@'
                  f'{match.group(3)}{newline}'
              )
              output.extend(body)
              index = end

          Path('/tmp/session-navigation-v2.patch').write_text(''.join(output))
          PY

          git apply --check /tmp/session-navigation-v2.patch
          git apply /tmp/session-navigation-v2.patch
          git rm -f \
            .github/session-navigation-v2.patch \
            .github/workflows/session-navigation-validation.yml

      - name: Format
        run: cargo fmt --all

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Commit validated implementation
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "fix(tui): add source-first session navigation"
          git push origin HEAD:codex/issue-153-session-navigation
