name: Session Navigation Validation

on:
  push:
    branches:
      - codex/issue-153-session-navigation
  pull_request:
    branches:
      - personal/local-clients

permissions:
  contents: write

concurrency:
  group: session-navigation-validation
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' ||
       github.head_ref == 'codex/issue-153-session-navigation')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/issue-153-session-navigation
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Normalize and check source-first Sessions patch
        id: patch
        shell: bash
        run: |
          set +e
          (
            python3 <<'PY'
          from pathlib import Path
          import re

          source = Path('.github/session-navigation-v2.patch').read_text().splitlines(keepends=True)
          output: list[str] = []
          index = 0
          header = re.compile(r'^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@(.*?)(\r?\n)?$')

          while index < len(source):
              match = header.match(source[index])
              if match is None:
                  output.append(source[index])
                  index += 1
                  continue

              end = index + 1
              while end < len(source):
                  line = source[end]
                  if line.startswith('@@ ') or line.startswith('--- '):
                      break
                  end += 1

              body = source[index + 1:end]
              old_count = sum(
                  1 for line in body if line.startswith(' ') or line.startswith('-')
              )
              new_count = sum(
                  1 for line in body if line.startswith(' ') or line.startswith('+')
              )
              newline = match.group(4) or '\n'
              output.append(
                  f'@@ -{match.group(1)},{old_count} +{match.group(2)},{new_count} @@'
                  f'{match.group(3)}{newline}'
              )
              output.extend(body)
              index = end

          Path('/tmp/session-navigation-v2.patch').write_text(''.join(output))
          PY
            git apply --check /tmp/session-navigation-v2.patch
          ) > /tmp/session-normalization-diagnostics.log 2>&1
          status=$?
          cat /tmp/session-normalization-diagnostics.log
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload normalized patch diagnostics
        if: steps.patch.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: normalized-session-patch-diagnostics
          path: |
            /tmp/session-navigation-v2.patch
            /tmp/session-normalization-diagnostics.log
          if-no-files-found: error

      - name: Stop after patch failure
        if: steps.patch.outputs.status != '0'
        run: exit 1

      - name: Apply source-first Sessions implementation
        if: steps.patch.outputs.status == '0'
        run: |
          git apply /tmp/session-navigation-v2.patch
          git rm -f \
            .github/session-navigation-v2.patch \
            .github/workflows/session-navigation-validation.yml

      - name: Format
        if: steps.patch.outputs.status == '0'
        run: cargo fmt --all

      - name: Clippy
        if: steps.patch.outputs.status == '0'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        if: steps.patch.outputs.status == '0'
        run: cargo test --workspace --all-features

      - name: Commit validated implementation
        if: steps.patch.outputs.status == '0'
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "fix(tui): add source-first session navigation"
          git push origin HEAD:codex/issue-153-session-navigation
