name: Build Native (Test Only)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/build-native.yml"
      - ".github/workflows/publish.yml"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packages/tokenx/package.json"
      - "packages/tokenx-*/package.json"
      - "scripts/check-release-workflow-safety.py"

env:
  MACOSX_DEPLOYMENT_TARGET: "10.13"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
            build: cargo build --release -p tokenx --target aarch64-apple-darwin
            strip: strip -x target/aarch64-apple-darwin/release/tokenx
            bin_name: tokenx
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: cargo zigbuild --release -p tokenx --target x86_64-unknown-linux-gnu
            strip: strip target/x86_64-unknown-linux-gnu/release/tokenx
            bin_name: tokenx
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: cargo build --release -p tokenx --target x86_64-pc-windows-msvc
            strip: ""
            bin_name: tokenx.exe

    steps:
      - uses: actions/checkout@v5

      - name: Check release workflow safety
        run: python3 scripts/check-release-workflow-safety.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: tokenx-${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}-${{ hashFiles('Cargo.lock') }}

      - uses: mlugg/setup-zig@v2
        if: ${{ contains(matrix.settings.target, 'linux') }}
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        if: ${{ contains(matrix.settings.target, 'linux') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild

      - name: Build native binary
        run: ${{ matrix.settings.build }}
        shell: bash

      - name: Strip native binary
        if: ${{ matrix.settings.strip != '' }}
        shell: bash
        run: ${{ matrix.settings.strip }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: tokenx-binary-${{ matrix.settings.target }}
          path: target/${{ matrix.settings.target }}/release/${{ matrix.settings.bin_name }}
          if-no-files-found: error
