name: Rustfmt Probe

on:
  push:
    branches:
      - codex/issue-153-rustfmt-probe

permissions:
  contents: read

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format sources
        run: cargo fmt --all
      - name: Collect formatted TUI sources
        run: |
          mkdir -p rustfmt-output/crates/tokscale-cli/src/tui
          cp -R crates/tokscale-cli/src/tui/ui rustfmt-output/crates/tokscale-cli/src/tui/
          git diff -- crates/tokscale-cli/src/tui/ui > rustfmt-output/rustfmt.patch
      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-output
          path: rustfmt-output
          if-no-files-found: error
