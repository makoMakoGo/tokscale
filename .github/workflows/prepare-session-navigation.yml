          # Source-first Sessions renderer; health remains a compact supplement.
          Path("crates/tokscale-cli/src/tui/ui/issues.rs").write_text(r'''use std::collections::BTreeMap;

          use chrono::{Local, TimeZone};
          use ratatui::prelude::*;
          use ratatui::widgets::{
              Block, Borders, Cell, Paragraph, Row, Scrollbar, ScrollbarOrientation, Table,
          };

          use super::widgets::{
              format_cost, format_tokens, get_client_display_name, truncate_display_width,
