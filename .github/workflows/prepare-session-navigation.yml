          pub fn get_sorted_session_sources(&self) -> Vec<SessionSourceSummary> {
              let mut sources = BTreeMap::<String, SessionSourceAccumulator>::new();
              for session in &self.data.sessions {
                  let entry = sources.entry(session.source.clone()).or_default();
                  entry.session_count = entry.session_count.saturating_add(1);
                  entry.models.extend(session.models.iter().cloned());
                  entry.message_count = entry.message_count.saturating_add(session.message_count);
                  entry.turn_count = entry.turn_count.saturating_add(session.turn_count);
                  entry.tokens = entry
                      .tokens
                      .checked_add(session.tokens.total())
                      .expect("session source token total exceeds u64::MAX");
                  entry.cost += session.cost;
                  entry.last_seen = entry.last_seen.max(session.last_seen);
              }

              let mut rows = sources
                  .into_iter()
                  .map(|(source, aggregate)| SessionSourceSummary {
                      source,
                      session_count: aggregate.session_count,
                      model_count: aggregate.models.len(),
                      message_count: aggregate.message_count,
                      turn_count: aggregate.turn_count,
                      tokens: aggregate.tokens,
                      cost: aggregate.cost,
                      last_seen: aggregate.last_seen,
                  })
                  .collect::<Vec<_>>();
              rows.sort_by(|left, right| {
                  let ordering = match self.sort_field {
                      SortField::Date => left.last_seen.cmp(&right.last_seen),
                      SortField::Tokens => left.tokens.cmp(&right.tokens),
                      SortField::Cost => left.cost.total_cmp(&right.cost),
                  };
                  let ordering = match self.sort_direction {
                      SortDirection::Ascending => ordering,
                      SortDirection::Descending => ordering.reverse(),
                  };
                  ordering.then_with(|| left.source.cmp(&right.source))
              });
              rows
          }

          pub fn get_sorted_sessions(&self) -> Vec<&SessionUsage> {
              let Some(source) = self.selected_session_source.as_deref() else {
                  return Vec::new();
              };
              let mut sessions = self
                  .data
                  .sessions
                  .iter()
                  .filter(|session| session.source == source)
                  .collect::<Vec<_>>();
              sessions.sort_by(|left, right| {
                  let ordering = match self.sort_field {
                      SortField::Date => left.last_seen.cmp(&right.last_seen),
                      SortField::Tokens => left.tokens.total().cmp(&right.tokens.total()),
                      SortField::Cost => left.cost.total_cmp(&right.cost),
                  };
                  let ordering = match self.sort_direction {
                      SortDirection::Ascending => ordering,
                      SortDirection::Descending => ordering.reverse(),
                  };
                  ordering.then_with(|| left.session_id.cmp(&right.session_id))
              });
              sessions
          }

