
name: Prepare Session Navigation

on:
  push:
    branches:
      - codex/issue-153-session-navigation

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/issue-153-session-navigation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply session navigation implementation
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"missing replacement in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          def insert_before_last_brace(path, addition):
              file = Path(path)
              text = file.read_text()
              head, sep, tail = text.rpartition("\n}")
              if not sep:
                  raise SystemExit(f"cannot find final brace in {path}")
              file.write_text(head + "\n" + addition.rstrip() + "\n}\n")

          # Core view model: retain session-level facts directly from UnifiedMessage.
          replace_once(
              "crates/tokscale-core/src/usage_views.rs",
              '''#[derive(Debug, Clone)]
          pub struct AgentEntry {
              pub agent: String,
              pub clients: String,
              pub tokens: UsageTokenBreakdown,
              pub cost: f64,
              pub message_count: u32,
              pub instance_count: u32,
          }

          #[derive(Debug, Clone)]
          pub struct DailyModelInfo {''',
