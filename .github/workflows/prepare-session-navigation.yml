          fn source_row(
              app: &App,
              source: &SessionSourceSummary,
              selected: bool,
              density: SourceTableDensity,
          ) -> Row<'static> {
              let source_label = get_client_display_name(&source.source);
              let mut cells = vec![
                  Cell::from(truncate_display_width(&source_label, 28))
                      .style(Style::default().add_modifier(Modifier::BOLD)),
                  Cell::from(Line::from(source.session_count.to_string()).centered())
                      .style(Style::default().fg(Color::Cyan)),
              ];
              match density {
                  SourceTableDensity::Compact => {
                      cells.push(Cell::from(format_timestamp(source.last_seen, true)));
                      cells.push(
                          Cell::from(Line::from(format_tokens(source.tokens)).right_aligned())
                              .style(Style::default().fg(Color::Cyan)),
                      );
                  }
                  SourceTableDensity::Core => {
                      cells.push(Cell::from(Line::from(source.model_count.to_string()).centered()));
                      cells.push(Cell::from(format_timestamp(source.last_seen, false)));
                      cells.push(
                          Cell::from(Line::from(format_tokens(source.tokens)).right_aligned())
                              .style(Style::default().fg(Color::Cyan)),
                      );
                      cells.push(
                          Cell::from(Line::from(format_cost(source.cost)).right_aligned())
                              .style(Style::default().fg(Color::Green)),
                      );
                  }
                  SourceTableDensity::Full => {
                      cells.push(Cell::from(Line::from(source.model_count.to_string()).centered()));
                      cells.push(Cell::from(Line::from(source.message_count.to_string()).centered()));
                      cells.push(Cell::from(Line::from(source.turn_count.to_string()).centered()));
                      cells.push(Cell::from(format_timestamp(source.last_seen, false)));
                      cells.push(
                          Cell::from(Line::from(format_tokens(source.tokens)).right_aligned())
                              .style(Style::default().fg(Color::Cyan)),
                      );
                      cells.push(
                          Cell::from(Line::from(format_cost(source.cost)).right_aligned())
                              .style(Style::default().fg(Color::Green)),
                      );
                  }
              }
              Row::new(cells).style(if selected {
                  Style::default().bg(app.theme.selection)
              } else {
                  Style::default()
              })
          }

          fn render_session_detail(frame: &mut Frame, app: &mut App, area: Rect) {
              let sessions = app.get_sorted_sessions();
              let source = app
                  .selected_session_source
                  .as_deref()
                  .map(get_client_display_name)
                  .unwrap_or_else(|| "Sessions".to_string());
              let block = panel_block(app, &format!("{source} Sessions")).title_top(
                  Line::from(Span::styled(
                      format!(" {} sessions ", sessions.len()),
                      Style::default().fg(app.theme.muted),
                  ))
                  .right_aligned(),
              );
              let inner = block.inner(area);
              frame.render_widget(block, area);
              if inner.is_empty() {
                  return;
              }

              if sessions.is_empty() {
                  app.set_max_visible_items(1);
                  frame.render_widget(
                      Paragraph::new("No sessions found for this source")
                          .style(Style::default().fg(app.theme.muted))
                          .alignment(Alignment::Center),
                      inner,
                  );
                  return;
              }

              let visible_height = inner.height.saturating_sub(1) as usize;
              let start = app.scroll_offset.min(sessions.len());
              let end = start.saturating_add(visible_height).min(sessions.len());
              let shown = end.saturating_sub(start);
              app.set_max_visible_items(shown.max(1));

              let density = SessionTableDensity::for_width(inner.width);
              let rows = sessions[start..end]
                  .iter()
                  .enumerate()
                  .map(|(offset, session)| {
                      session_row(app, session, start + offset == app.selected_index, density)
                  })
                  .collect::<Vec<_>>();
              frame.render_widget(
                  Table::new(rows, session_widths(density))
                      .header(session_header(app, density))
                      .column_spacing(1),
                  inner,
              );

              render_scrollbar(frame, area, sessions.len(), shown, app.scroll_offset);
          }

          #[derive(Clone, Copy)]
          enum SessionTableDensity {
              Compact,
              Core,
              Full,
          }

          impl SessionTableDensity {
              fn for_width(width: u16) -> Self {
                  if width >= 122 {
                      Self::Full
                  } else if width >= 84 {
                      Self::Core
                  } else {
                      Self::Compact
                  }
              }
          }

          fn session_header(app: &App, density: SessionTableDensity) -> Row<'static> {
              let labels = match density {
                  SessionTableDensity::Compact => {
                      vec!["Last active", "Session", "Workspace", "Tokens"]
                  }
                  SessionTableDensity::Core => {
                      vec!["Last active", "Session", "Workspace", "Models", "Tokens", "Cost"]
                  }
                  SessionTableDensity::Full => vec![
                      "Last active",
                      "Session",
                      "Workspace",
                      "Models",
                      "Msgs",
                      "Turns",
                      "Tokens",
                      "Cost",
                  ],
              };
              Row::new(labels).style(
                  Style::default()
                      .fg(app.theme.accent)
                      .add_modifier(Modifier::BOLD),
              )
          }

          fn session_widths(density: SessionTableDensity) -> Vec<Constraint> {
              match density {
                  SessionTableDensity::Compact => vec![
                      Constraint::Length(12),
                      Constraint::Percentage(34),
                      Constraint::Percentage(34),
                      Constraint::Length(11),
                  ],
                  SessionTableDensity::Core => vec![
                      Constraint::Length(16),
                      Constraint::Percentage(26),
                      Constraint::Percentage(25),
                      Constraint::Percentage(20),
                      Constraint::Length(11),
                      Constraint::Length(10),
                  ],
                  SessionTableDensity::Full => vec![
                      Constraint::Length(16),
                      Constraint::Percentage(22),
                      Constraint::Percentage(20),
                      Constraint::Percentage(19),
                      Constraint::Length(7),
                      Constraint::Length(7),
                      Constraint::Length(12),
                      Constraint::Length(10),
                  ],
              }
          }

          fn session_row(
              app: &App,
              session: &SessionUsage,
              selected: bool,
              density: SessionTableDensity,
          ) -> Row<'static> {
              let workspace = session
                  .workspace_label
                  .as_deref()
                  .or(session.workspace_key.as_deref())
                  .unwrap_or("—");
              let models = session.models.iter().cloned().collect::<Vec<_>>().join(", ");
              let mut cells = vec![
                  Cell::from(format_timestamp(
                      session.last_seen,
                      matches!(density, SessionTableDensity::Compact),
                  )),
                  Cell::from(truncate_display_width(&session.session_id, 36))
                      .style(Style::default().fg(app.theme.foreground)),
                  Cell::from(truncate_display_width(workspace, 32))
                      .style(Style::default().fg(app.theme.muted)),
              ];
              match density {
                  SessionTableDensity::Compact => {
                      cells.push(
                          Cell::from(Line::from(format_tokens(session.tokens.total())).right_aligned())
                              .style(Style::default().fg(Color::Cyan)),
                      );
                  }
                  SessionTableDensity::Core => {
                      cells.push(Cell::from(truncate_display_width(&models, 28)));
                      cells.push(
                          Cell::from(Line::from(format_tokens(session.tokens.total())).right_aligned())
                              .style(Style::default().fg(Color::Cyan)),
                      );
                      cells.push(
                          Cell::from(Line::from(format_cost(session.cost)).right_aligned())
                              .style(Style::default().fg(Color::Green)),
                      );
                  }
                  SessionTableDensity::Full => {
                      cells.push(Cell::from(truncate_display_width(&models, 30)));
                      cells.push(Cell::from(Line::from(session.message_count.to_string()).centered()));
                      cells.push(Cell::from(Line::from(session.turn_count.to_string()).centered()));
                      cells.push(
                          Cell::from(Line::from(format_tokens(session.tokens.total())).right_aligned())
                              .style(Style::default().fg(Color::Cyan)),
                      );
                      cells.push(
                          Cell::from(Line::from(format_cost(session.cost)).right_aligned())
                              .style(Style::default().fg(Color::Green)),
                      );
                  }
              }
              Row::new(cells).style(if selected {
                  Style::default().bg(app.theme.selection)
              } else {
                  Style::default()
              })
          }

          fn render_source_health(frame: &mut Frame, app: &App, area: Rect) {
              let health = &app.data.health;
              let total_sources = health.clean_sources
                  + health.degraded_sources
                  + health.partial_sources
                  + health.failed_sources;
              let issue_count = health.issue_count();
              let block = panel_block(app, "Source Health").title_top(
                  Line::from(Span::styled(
                      format!(" {issue_count} issues "),
                      Style::default().fg(if issue_count == 0 {
                          app.theme.muted
                      } else {
                          Color::Yellow
                      }),
                  ))
                  .right_aligned(),
              );
              let inner = block.inner(area);
              frame.render_widget(block, area);
              if inner.is_empty() {
                  return;
              }

              let mut lines = vec![Line::from(vec![
                  Span::styled("Sources ", Style::default().fg(app.theme.muted)),
                  Span::styled(total_sources.to_string(), Style::default().fg(Color::Cyan)),
                  Span::styled("  ·  clean ", Style::default().fg(app.theme.muted)),
                  Span::styled(health.clean_sources.to_string(), Style::default().fg(Color::Green)),
                  Span::styled("  ·  degraded ", Style::default().fg(app.theme.muted)),
                  Span::styled(
                      health.degraded_sources.to_string(),
                      Style::default().fg(if health.degraded_sources == 0 {
                          app.theme.muted
                      } else {
                          Color::Yellow
                      }),
                  ),
                  Span::styled("  ·  partial/failed ", Style::default().fg(app.theme.muted)),
                  Span::styled(
                      (health.partial_sources + health.failed_sources).to_string(),
                      Style::default().fg(if health.partial_sources + health.failed_sources == 0 {
                          app.theme.muted
                      } else {
                          Color::Red
                      }),
                  ),
                  Span::styled("  ·  rejected ", Style::default().fg(app.theme.muted)),
                  Span::styled(
                      health.rejected_records.to_string(),
                      Style::default().fg(if health.rejected_records == 0 {
                          app.theme.muted
                      } else {
                          Color::Yellow
                      }),
                  ),
              ])];

              if !health.issues.is_empty() {
                  let mut affected = BTreeMap::<String, u64>::new();
                  for issue in &health.issues {
                      let count = u64::try_from(issue.affected_sources).unwrap_or(u64::MAX);
                      let entry = affected.entry(issue.source.clone()).or_default();
                      *entry = entry.saturating_add(count);
                  }
                  let labels = affected
                      .into_iter()
                      .map(|(source, count)| format!("{} ({count})", get_client_display_name(&source)))
                      .collect::<Vec<_>>()
                      .join(", ");
                  lines.push(Line::from(vec![
                      Span::styled("Affected: ", Style::default().fg(app.theme.muted)),
                      Span::styled(labels, Style::default().fg(Color::Yellow)),
                  ]));
              }

              frame.render_widget(
                  Paragraph::new(lines.into_iter().take(inner.height as usize).collect::<Vec<_>>()),
                  inner,
              );
          }

          fn format_timestamp(timestamp_ms: i64, compact: bool) -> String {
              let Some(datetime) = Local.timestamp_millis_opt(timestamp_ms).single() else {
                  return "—".to_string();
              };
              if compact {
                  datetime.format("%m-%d %H:%M").to_string()
              } else {
                  datetime.format("%Y-%m-%d %H:%M").to_string()
              }
          }

          fn render_scrollbar(
              frame: &mut Frame,
              area: Rect,
              total: usize,
              visible: usize,
              scroll: usize,
          ) {
              if total <= visible || visible == 0 {
                  return;
              }
              let mut state = viewport_scrollbar_state(total, scroll, visible);
              frame.render_stateful_widget(
                  Scrollbar::new(ScrollbarOrientation::VerticalRight)
                      .begin_symbol(Some("▲"))
                      .end_symbol(Some("▼")),
                  area.inner(Margin {
                      horizontal: 0,
                      vertical: 1,
                  }),
                  &mut state,
              );
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn invalid_timestamp_uses_unknown_marker() {
                  assert_eq!(format_timestamp(i64::MAX, false), "—");
              }
          }
