                      "anthropic",
                      "session-a",
                      3_000,
                      crate::TokenBreakdown {
                          input: 7,
                          output: 1,
                          ..Default::default()
                      },
                      0.10,
                  );

                  let data = TuiUsageHarness
                      .aggregate_messages(
                          vec![first, second, other_source],
                          &GroupBy::WorkspaceModel,
                      )
                      .unwrap();

                  assert_eq!(data.sessions.len(), 2);
                  let codex = data
                      .sessions
                      .iter()
                      .find(|session| session.source == "codex")
                      .unwrap();
                  assert_eq!(codex.session_id, "session-a");
                  assert_eq!(codex.workspace_label.as_deref(), Some("tokscale"));
                  assert_eq!(
                      codex.models.iter().map(String::as_str).collect::<Vec<_>>(),
                      vec!["gpt-5.6-sol"]
