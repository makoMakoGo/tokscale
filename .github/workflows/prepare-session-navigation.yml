                  assert_eq!(codex.tokens.total(), 36);
                  assert_eq!(codex.message_count, 5);
                  assert_eq!(codex.turn_count, 1);
                  assert_eq!(codex.first_seen, 1_000);
                  assert_eq!(codex.last_seen, 2_000);
              }
