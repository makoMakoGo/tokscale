          };
          use crate::tui::app::{App, SessionSourceSummary};
          use crate::tui::data::SessionUsage;

          pub fn render(frame: &mut Frame, app: &mut App, area: Rect) {
              if app.is_session_detail_active() {
                  render_session_detail(frame, app, area);
              } else {
                  render_source_index(frame, app, area);
              }
          }

          fn panel_block<'a>(app: &App, title: &'a str) -> Block<'a> {
              Block::default()
                  .borders(Borders::ALL)
                  .border_style(Style::default().fg(app.theme.border))
                  .title(Span::styled(
                      format!(" {title} "),
                      Style::default()
                          .fg(app.theme.accent)
                          .add_modifier(Modifier::BOLD),
                  ))
                  .style(Style::default().bg(app.theme.background))
          }

          fn render_source_index(frame: &mut Frame, app: &mut App, area: Rect) {
              if area.height >= 12 {
                  let chunks = Layout::default()
                      .direction(Direction::Vertical)
                      .constraints([Constraint::Min(5), Constraint::Length(5)])
                      .split(area);
                  render_source_table(frame, app, chunks[0]);
                  render_source_health(frame, app, chunks[1]);
              } else {
                  render_source_table(frame, app, area);
              }
          }

          fn render_source_table(frame: &mut Frame, app: &mut App, area: Rect) {
              let sources = app.get_sorted_session_sources();
              let block = panel_block(app, "Sessions by Source").title_top(
                  Line::from(Span::styled(
                      format!(
                          " {} sources · {} sessions ",
                          sources.len(),
                          app.data.sessions.len()
                      ),
                      Style::default().fg(app.theme.muted),
                  ))
                  .right_aligned(),
              );
              let inner = block.inner(area);
              frame.render_widget(block, area);
              if inner.is_empty() {
                  return;
              }

              if sources.is_empty() {
                  app.set_max_visible_items(1);
                  frame.render_widget(
                      Paragraph::new("No session data available")
                          .style(Style::default().fg(app.theme.muted))
                          .alignment(Alignment::Center),
                      inner,
                  );
                  return;
              }

              let visible_height = inner.height.saturating_sub(1) as usize;
              let start = app.scroll_offset.min(sources.len());
              let end = start.saturating_add(visible_height).min(sources.len());
              let shown = end.saturating_sub(start);
              app.set_max_visible_items(shown.max(1));

              let density = SourceTableDensity::for_width(inner.width);
              let rows = sources[start..end]
                  .iter()
                  .enumerate()
                  .map(|(offset, source)| {
                      source_row(app, source, start + offset == app.selected_index, density)
                  })
                  .collect::<Vec<_>>();
              let table = Table::new(rows, source_widths(density))
                  .header(source_header(app, density))
                  .column_spacing(1);
              frame.render_widget(table, inner);

              render_scrollbar(frame, area, sources.len(), shown, app.scroll_offset);
          }

          #[derive(Clone, Copy)]
          enum SourceTableDensity {
              Compact,
              Core,
              Full,
          }

          impl SourceTableDensity {
              fn for_width(width: u16) -> Self {
                  if width >= 112 {
                      Self::Full
                  } else if width >= 78 {
                      Self::Core
                  } else {
                      Self::Compact
                  }
              }
          }

          fn source_header(app: &App, density: SourceTableDensity) -> Row<'static> {
              let labels = match density {
                  SourceTableDensity::Compact => vec!["Source", "Sessions", "Last active", "Tokens"],
                  SourceTableDensity::Core => {
                      vec!["Source", "Sessions", "Models", "Last active", "Tokens", "Cost"]
                  }
                  SourceTableDensity::Full => vec![
                      "Source",
                      "Sessions",
                      "Models",
                      "Msgs",
                      "Turns",
                      "Last active",
                      "Tokens",
                      "Cost",
                  ],
              };
              Row::new(labels).style(
                  Style::default()
                      .fg(app.theme.accent)
                      .add_modifier(Modifier::BOLD),
              )
          }

          fn source_widths(density: SourceTableDensity) -> Vec<Constraint> {
              match density {
