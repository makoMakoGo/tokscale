name: Apply Session Navigation

on:
  pull_request:
    branches:
      - personal/local-clients

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'codex/issue-153-session-navigation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/issue-153-session-navigation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply prepared source changes
        run: |
          awk '
            /cat > \/tmp\/session-navigation\.patch\.b64 <<'\''PATCH'\''/ { copy = 1; next }
            copy && /^PATCH$/ { exit }
            copy { print }
          ' .github/workflows/session-navigation-validation.yml > /tmp/session-navigation.patch.b64
          test -s /tmp/session-navigation.patch.b64
          base64 -d /tmp/session-navigation.patch.b64 > /tmp/session-navigation.patch
          git apply /tmp/session-navigation.patch
          python3 <<'PY'
          from pathlib import Path

          hourly = Path('crates/tokscale-cli/src/tui/ui/hourly_profile.rs')
          text = hourly.read_text()
          old = '#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]'
          if old not in text:
              raise SystemExit('hourly profile lint cleanup target not found')
          hourly.write_text(text.replace(old, '#[cfg(test)]\nmod tests {\n    #[test]', 1))

          daily = Path('crates/tokscale-cli/src/tui/ui/daily_profile.rs')
          text = daily.read_text()
          old = '''\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn profile_and_table_have_a_deliberate_minimum_height() {\n        assert!(MIN_COMBINED_HEIGHT > PANEL_HEIGHT);\n    }\n}\n'''
          if old not in text:
              raise SystemExit('daily profile lint cleanup target not found')
          daily.write_text(text.replace(old, '\n', 1))

          issues = Path('crates/tokscale-cli/src/tui/ui/issues.rs')
          text = issues.read_text()
          old = '''    let models = session.models.iter().cloned().collect::<Vec<_>>().join(", ");
    let mut cells = vec![
        Cell::from(truncate_display_width(&session.session_id, 28)),
        Cell::from(truncate_display_width(workspace, 24)),
        Cell::from(truncate_display_width(&models, if narrow { 24 } else { 34 })),
    ];'''
          new = '''    let models = session.models.iter().cloned().collect::<Vec<_>>().join(", ");
    let model_style = if selected {
        style
    } else {
        app.theme.secondary_text_style()
    };
    let mut cells = vec![
        Cell::from(truncate_display_width(&session.session_id, 28)),
        Cell::from(truncate_display_width(workspace, 24)),
        Cell::from(truncate_display_width(&models, if narrow { 24 } else { 34 }))
            .style(model_style),
    ];'''
          if old not in text:
              raise SystemExit('session model style target not found')
          issues.write_text(text.replace(old, new, 1))
          PY
          rm -f \
            .github/workflows/apply-session-navigation.yml \
            .github/workflows/prepare-session-navigation.yml \
            .github/workflows/session-navigation-diagnostics.yml \
            .github/workflows/session-navigation-validation.yml
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Commit validated implementation
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "fix(tui): add source-first session navigation"
          git push origin HEAD:codex/issue-153-session-navigation
