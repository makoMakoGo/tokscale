name: Core CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - personal/local-clients

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-core:
    name: Core CI / rust-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          # Release validation compares against the PR base commit, which may
          # be older than the current merge ref's parents.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Cache cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: core-ci-${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            core-ci-${{ runner.os }}-cargo-

      - name: Validate release tooling
        run: bash scripts/test-release-tooling.sh

      - name: Validate release pull request
        if: github.event_name == 'pull_request'
        env:
          RELEASE_EVENT_NAME: pull_request
          RELEASE_BEFORE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
        run: bash scripts/check-release-commit.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-features

  session-navigation-bootstrap:
    if: github.head_ref == 'codex/issue-153-session-navigation'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: codex/issue-153-session-navigation
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      - name: Check prepared patch
        id: patch
        shell: bash
        run: |
          set +e
          git apply --check .github/session-navigation-v2.patch > session-patch-diagnostics.log 2>&1
          status=$?
          cat session-patch-diagnostics.log
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload patch diagnostics
        if: steps.patch.outputs.status != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: session-patch-diagnostics
          path: session-patch-diagnostics.log
          if-no-files-found: error

      - name: Stop after patch failure
        if: steps.patch.outputs.status != '0'
        run: exit 1

      - name: Apply, validate, and publish source changes
        if: steps.patch.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          git apply .github/session-navigation-v2.patch
          git rm -f \
            .github/session-navigation-v2.patch \
            .github/workflows/session-navigation-validation.yml

          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features

          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "fix(tui): add source-first session navigation"
          git push origin HEAD:codex/issue-153-session-navigation
