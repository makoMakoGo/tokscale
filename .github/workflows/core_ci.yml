name: Core CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - personal/local-clients

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-core:
    name: Core CI / rust-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Cache cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: core-ci-${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            core-ci-${{ runner.os }}-cargo-

      - name: Validate release tooling
        run: bash scripts/test-release-tooling.sh

      - name: Validate release pull request
        if: github.event_name == 'pull_request'
        env:
          RELEASE_EVENT_NAME: pull_request
          RELEASE_BEFORE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
        run: bash scripts/check-release-commit.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-features

  session-navigation-bootstrap:
    if: github.head_ref == 'codex/issue-153-session-navigation'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: codex/issue-153-session-navigation
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      - name: Apply, validate, and publish source changes
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .github/session-navigation-patch-source.yml ]; then
            echo "Session navigation source already materialized"
            exit 0
          fi

          awk '
            /cat > \/tmp\/session-navigation\.patch\.b64 <<'\''PATCH'\''/ { copy = 1; next }
            copy && /^PATCH$/ { exit }
            copy { print }
          ' .github/session-navigation-patch-source.yml > /tmp/session-navigation.patch.b64
          test -s /tmp/session-navigation.patch.b64
          base64 -d /tmp/session-navigation.patch.b64 > /tmp/session-navigation.patch
          git apply /tmp/session-navigation.patch

          python3 <<'PY'
          from pathlib import Path

          hourly = Path('crates/tokscale-cli/src/tui/ui/hourly_profile.rs')
          text = hourly.read_text()
          old = '#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]'
          if old not in text:
              raise SystemExit('hourly profile lint cleanup target not found')
          hourly.write_text(text.replace(old, '#[cfg(test)]\nmod tests {\n    #[test]', 1))

          daily = Path('crates/tokscale-cli/src/tui/ui/daily_profile.rs')
          text = daily.read_text()
          old = '''\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn profile_and_table_have_a_deliberate_minimum_height() {\n        assert!(MIN_COMBINED_HEIGHT > PANEL_HEIGHT);\n    }\n}\n'''
          if old not in text:
              raise SystemExit('daily profile lint cleanup target not found')
          daily.write_text(text.replace(old, '\n', 1))

          issues = Path('crates/tokscale-cli/src/tui/ui/issues.rs')
          text = issues.read_text()
          old = '''    let models = session.models.iter().cloned().collect::<Vec<_>>().join(", ");
    let mut cells = vec![
        Cell::from(truncate_display_width(&session.session_id, 28)),
        Cell::from(truncate_display_width(workspace, 24)),
        Cell::from(truncate_display_width(&models, if narrow { 24 } else { 34 })),
    ];'''
          new = '''    let models = session.models.iter().cloned().collect::<Vec<_>>().join(", ");
    let model_style = if selected {
        style
    } else {
        app.theme.secondary_text_style()
    };
    let mut cells = vec![
        Cell::from(truncate_display_width(&session.session_id, 28)),
        Cell::from(truncate_display_width(workspace, 24)),
        Cell::from(truncate_display_width(&models, if narrow { 24 } else { 34 }))
            .style(model_style),
    ];'''
          if old not in text:
              raise SystemExit('session model style target not found')
          issues.write_text(text.replace(old, new, 1))
          PY

          rm -f \
            .github/session-navigation-patch-source.yml \
            .github/session-navigation-trigger \
            .github/workflows/apply-session-navigation.yml \
            .github/workflows/prepare-session-navigation.yml \
            .github/workflows/session-navigation-diagnostics.yml \
            .github/workflows/session-navigation-validation.yml

          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features

          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "fix(tui): add source-first session navigation"
          git push origin HEAD:codex/issue-153-session-navigation
