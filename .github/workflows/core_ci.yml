name: Core CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - personal/local-clients

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-core:
    name: Core CI / rust-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: core-ci-${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            core-ci-${{ runner.os }}-cargo-

      - name: Validate release tooling
        run: |
          bash scripts/check-version-coherence.sh
          bash scripts/test-check-version-coherence.sh
          bash scripts/test-bump-release-version.sh
          bash scripts/test-check-release-commit.sh
          bash scripts/test-npm-release-state.sh
          bash scripts/test-release-workflow-safety.sh

      - name: Validate release pull request
        if: github.event_name == 'pull_request'
        env:
          RELEASE_EVENT_NAME: pull_request
          RELEASE_BEFORE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
        run: bash scripts/check-release-commit.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-features
